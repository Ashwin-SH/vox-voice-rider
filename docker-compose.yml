services:
  web:
    build: .
    ports:
      # Judges get 3000 by default ("docker compose up" just works). Override with
      # VOX_WEB_PORT=xxxx docker compose up  if 3000 is taken on your machine.
      - "${VOX_WEB_PORT:-3000}:3000"
    environment:
      # VOX starts with NO keys. Leave GEMINI_API_KEY empty for keyless demo mode.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: postgres://vox:vox@db:5432/vox
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vox
      POSTGRES_PASSWORD: vox
      POSTGRES_DB: vox
    # Not published to the host: the web service reaches Postgres over the
    # internal compose network (db:5432). Avoids host port clashes on any machine.
    volumes:
      - vox_pgdata:/var/lib/postgresql/data

volumes:
  vox_pgdata:
